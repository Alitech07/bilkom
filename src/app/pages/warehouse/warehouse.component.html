<div class="page-header">
  <h1 class="page-title">Ombor</h1>
  <p class="page-subtitle">Ombordagi mahsulotlar va qoldiqlar</p>
</div>

<app-grid-toolbar
  [showSearch]="cfgSearch"
  [showFilter]="cfgFilter"
  [showExcel]="cfgExcel"
  (searchChange)="onSearch($event)"
  (excelClick)="onExcel()"
>
  <button mat-raised-button color="primary" (click)="openAdd()">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
      <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
    </svg>
    Qo'shish
  </button>
  <button mat-stroked-button color="primary" (click)="openAddNew()" style="margin-left:8px">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
      <rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><line x1="17.5" y1="14" x2="17.5" y2="21"/><line x1="14" y1="17.5" x2="21" y2="17.5"/>
    </svg>
    Yangi mahsulot
  </button>
</app-grid-toolbar>

<app-grid
  [gridId]="gridId"
  [showActions]="true"
  (configLoaded)="pageConfig = $event"
  (editClick)="onEdit($event)"
  (deleteClick)="onDelete($event)"
></app-grid>
