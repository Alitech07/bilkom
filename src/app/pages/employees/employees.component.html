<div class="page-header">
  <h1 class="page-title">Xodimlar</h1>
  <p class="page-subtitle">Xodimlar va tizim foydalanuvchilari boshqaruvi</p>
</div>

<mat-tab-group class="employees-tabs" animationDuration="200ms">

  <!-- ── Tab 1: Xodimlar ───────────────────────────────── -->
  <mat-tab label="Xodimlar">
    <div class="tab-content">
      <app-grid-toolbar
        [showSearch]="empCfgSearch"
        [showFilter]="empCfgFilter"
        [showExcel]="empCfgExcel"
        (searchChange)="onEmpSearch($event)"
        (excelClick)="onEmpExcel()"
      >
        <button mat-raised-button color="primary" (click)="openAddEmployee()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Qo'shish
        </button>
      </app-grid-toolbar>

      <app-grid
        #empGrid
        [gridId]="empGridId"
        [showActions]="true"
        (configLoaded)="empPageConfig = $event"
        (editClick)="onEditEmployee($event)"
        (deleteClick)="onDeleteEmployee($event)"
      ></app-grid>
    </div>
  </mat-tab>

  <!-- ── Tab 2: Foydalanuvchilar ───────────────────────── -->
  <mat-tab label="Foydalanuvchilar">
    <div class="tab-content">
      <app-grid-toolbar
        [showSearch]="true"
        [showFilter]="false"
        [showExcel]="false"
        (searchChange)="userGrid?.applyFilter($event)"
      >
        <button mat-raised-button color="primary" (click)="openAddUser()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Qo'shish
        </button>
      </app-grid-toolbar>

      <app-grid
        #userGrid
        [externalConfig]="userGridConfig"
        [externalLoading]="usersLoading"
        [showActions]="true"
        (editClick)="onEditUser($event)"
        (deleteClick)="onDeleteUser($event)"
      ></app-grid>
    </div>
  </mat-tab>

</mat-tab-group>
