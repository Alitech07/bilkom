<h2 class="dialog-title">
  {{ isEdit ? 'Kategoriyani tahrirlash' : 'Yangi kategoriya' }}
</h2>

<mat-dialog-content class="dialog-body">
  <form [formGroup]="form">

    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Nomi</mat-label>
      <input matInput formControlName="name" placeholder="Masalan: Kislotalar">
      <mat-error *ngIf="form.get('name')?.hasError('required')">Majburiy maydon</mat-error>
    </mat-form-field>

    <mat-form-field appearance="outline" style="width:100%">
      <mat-label>Tavsif</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Qisqacha tavsif..."></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-stroked-button (click)="cancel()">Bekor qilish</button>
  <button mat-raised-button color="primary" (click)="submit()">
    {{ isEdit ? 'Saqlash' : 'Qo\'shish' }}
  </button>
</mat-dialog-actions>
