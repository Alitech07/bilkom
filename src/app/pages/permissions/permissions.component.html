<div class="page-header">
  <h1 class="page-title">Permissiyalar</h1>
  <p class="page-subtitle">Foydalanuvchi rollari uchun ruxsatlar</p>
</div>

<!-- Controls -->
<div class="perm-controls">
  <mat-form-field appearance="outline" class="perm-select">
    <mat-label>Rolni tanlang</mat-label>
    <mat-select
      [(ngModel)]="selectedRoleId"
      (ngModelChange)="onRoleChange($event)"
      [disabled]="loading"
    >
      <mat-option *ngFor="let role of roles" [value]="role.id">
        {{ role.name }}
      </mat-option>
    </mat-select>
  </mat-form-field>

  <button
    mat-raised-button
    color="primary"
    class="perm-save-btn"
    [disabled]="!selectedRoleId || saving"
    (click)="save()"
  >
    <mat-spinner *ngIf="saving" diameter="18" class="perm-spinner"></mat-spinner>
    <svg *ngIf="!saving" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
      <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/>
      <polyline points="17 21 17 13 7 13 7 21"/>
      <polyline points="7 3 7 8 15 8"/>
    </svg>
    Saqlash
  </button>
</div>

<!-- Loading -->
<div *ngIf="loading" class="perm-loading">
  <mat-spinner diameter="36" color="primary"></mat-spinner>
  <span>Yuklanmoqda...</span>
</div>

<!-- Empty state -->
<div *ngIf="!loading && moduleGroups.length === 0" class="perm-empty">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#C1C9D2" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/>
  </svg>
  <p>Permissiyalar topilmadi. Avval permission qo'shing.</p>
</div>

<!-- No role selected hint -->
<div *ngIf="!loading && moduleGroups.length > 0 && !selectedRoleId" class="perm-hint">
  Permissiyalarni belgilash uchun avval rol tanlang
</div>

<!-- Module grid -->
<div *ngIf="!loading && moduleGroups.length > 0" class="perm-grid">
  <div class="perm-module" *ngFor="let group of moduleGroups">

    <div class="perm-module__header">
      {{ group.moduleName }}
    </div>

    <div class="perm-module__body">
      <div class="perm-row" *ngFor="let row of group.rows">
        <div class="perm-row__left">
          <mat-checkbox
            [(ngModel)]="row.checked"
            [disabled]="!selectedRoleId"
            color="primary"
          >
            {{ row.permission.description || row.permission.code }}
          </mat-checkbox>
        </div>
        <div class="perm-row__right">
          <span class="perm-action perm-action--{{ row.action }}">{{ row.action }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
