<div class="page-header">
  <h1 class="page-title">Hisob-faktura</h1>
  <p class="page-subtitle">Buyurtma tanlab, hisob-fakturasini ko'ring va chop eting</p>
</div>
<app-grid-toolbar
  [showSearch]="cfgSearch"
  [showFilter]="false"
  [showExcel]="false"
  (searchChange)="onSearch($event)"
></app-grid-toolbar>
<app-grid
  [gridId]="gridId"
  [showActions]="false"
  (configLoaded)="pageConfig = $event"
  (fileClick)="onOpenInvoice($event)"
></app-grid>
