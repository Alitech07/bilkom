<div class="page-header">
  <h1 class="page-title">Sozlamalar</h1>
  <p class="page-subtitle">To'lov va yetkazib berish turlarini boshqaring</p>
</div>

<div class="settings-grid">

  <div class="settings-card">
    <div class="card-header">
      <h2 class="card-title">To'lov turlari</h2>
    </div>

    <ul class="items-list">
      <li *ngFor="let item of paymentTypes" class="item-row">

        <ng-container *ngIf="!item.editing">
          <span class="item-name">{{ item.name }}</span>
          <div class="item-actions">
            <ng-container *appHasPermission="'SETTINGS_EDIT'">
              <button class="btn-icon" (click)="startEdit(item)" title="Tahrirlash">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'SETTINGS_DELETE'">
              <button class="btn-icon btn-danger" (click)="deletePaymentType(item.id)" title="O'chirish">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                  <path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
              </button>
            </ng-container>
          </div>
        </ng-container>

        <ng-container *ngIf="item.editing">
          <input class="inline-input" [(ngModel)]="item.editName" (keyup.enter)="savePaymentType(item)">
          <div class="item-actions">
            <button class="btn-save" (click)="savePaymentType(item)">Saqlash</button>
            <button class="btn-cancel" (click)="cancelEdit(item)">Bekor</button>
          </div>
        </ng-container>

      </li>

      <li *ngIf="paymentTypes.length === 0" class="empty-row">Hozircha yo'q</li>
    </ul>

    <div *appHasPermission="'SETTINGS_CREATE'" class="add-row">
      <input class="add-input" [(ngModel)]="newPaymentName" placeholder="Yangi to'lov turi..." (keyup.enter)="addPaymentType()">
      <button class="btn-add" (click)="addPaymentType()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Qo'shish
      </button>
    </div>
  </div>

  <div class="settings-card">
    <div class="card-header">
      <h2 class="card-title">Yetkazib berish turlari</h2>
    </div>

    <ul class="items-list">
      <li *ngFor="let item of deliveryTypes" class="item-row">

        <ng-container *ngIf="!item.editing">
          <span class="item-name">{{ item.name }}</span>
          <div class="item-actions">
            <ng-container *appHasPermission="'SETTINGS_EDIT'">
              <button class="btn-icon" (click)="startEdit(item)" title="Tahrirlash">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'SETTINGS_DELETE'">
              <button class="btn-icon btn-danger" (click)="deleteDeliveryType(item.id)" title="O'chirish">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                  <path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
              </button>
            </ng-container>
          </div>
        </ng-container>

        <ng-container *ngIf="item.editing">
          <input class="inline-input" [(ngModel)]="item.editName" (keyup.enter)="saveDeliveryType(item)">
          <div class="item-actions">
            <button class="btn-save" (click)="saveDeliveryType(item)">Saqlash</button>
            <button class="btn-cancel" (click)="cancelEdit(item)">Bekor</button>
          </div>
        </ng-container>

      </li>

      <li *ngIf="deliveryTypes.length === 0" class="empty-row">Hozircha yo'q</li>
    </ul>

    <div *appHasPermission="'SETTINGS_CREATE'" class="add-row">
      <input class="add-input" [(ngModel)]="newDeliveryName" placeholder="Yangi yetkazib berish turi..." (keyup.enter)="addDeliveryType()">
      <button class="btn-add" (click)="addDeliveryType()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Qo'shish
      </button>
    </div>
  </div>

  <div class="settings-card">
    <div class="card-header">
      <h2 class="card-title">Valyutalar</h2>
    </div>

    <ul class="items-list">
      <li *ngFor="let item of currencies" class="item-row">

        <ng-container *ngIf="!item.editing">
          <span class="item-name">{{ item.name }}</span>
          <div class="item-actions">
            <ng-container *appHasPermission="'SETTINGS_EDIT'">
              <button class="btn-icon" (click)="startEdit(item)" title="Tahrirlash">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/>
                  <path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/>
                </svg>
              </button>
            </ng-container>
            <ng-container *appHasPermission="'SETTINGS_DELETE'">
              <button class="btn-icon btn-danger" (click)="deleteCurrency(item.id)" title="O'chirish">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/>
                  <path d="M10 11v6"/><path d="M14 11v6"/>
                </svg>
              </button>
            </ng-container>
          </div>
        </ng-container>

        <ng-container *ngIf="item.editing">
          <input class="inline-input" [(ngModel)]="item.editName" (keyup.enter)="saveCurrency(item)">
          <div class="item-actions">
            <button class="btn-save" (click)="saveCurrency(item)">Saqlash</button>
            <button class="btn-cancel" (click)="cancelEdit(item)">Bekor</button>
          </div>
        </ng-container>

      </li>

      <li *ngIf="currencies.length === 0" class="empty-row">Hozircha yo'q</li>
    </ul>

    <div *appHasPermission="'SETTINGS_CREATE'" class="add-row">
      <input class="add-input" [(ngModel)]="newCurrencyName" placeholder="Yangi valyuta... (USD, EUR, UZS)" (keyup.enter)="addCurrency()">
      <button class="btn-add" (click)="addCurrency()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
        </svg>
        Qo'shish
      </button>
    </div>
  </div>

</div>
