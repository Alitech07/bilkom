<div class="page-header">
  <h1 class="page-title">Xaridlar</h1>
  <p class="page-subtitle">Xaridlar va hisobotlar boshqaruvi</p>
</div>

<mat-tab-group class="purchases-tabs" animationDuration="200ms">

  <!-- ── Tab 1: Xaridlar ─────────────────────────────────── -->
  <mat-tab label="Xaridlar">
    <div class="tab-content">
      <app-grid-toolbar
        [showSearch]="cfgSearch"
        [showFilter]="cfgFilter"
        [showExcel]="cfgExcel"
        (searchChange)="onSearch($event)"
        (filterClick)="onFilter()"
        (excelClick)="onExcel()"
      >
        <button *appHasPermission="'PURCHASES_CREATE'" mat-raised-button color="primary" (click)="openAdd()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"
               stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
          Qo'shish
        </button>
      </app-grid-toolbar>

      <app-grid
        #purchaseGrid
        [gridId]="gridId"
        [showActions]="true"
        [editPermission]="'PURCHASES_EDIT'"
        [deletePermission]="'PURCHASES_DELETE'"
        (configLoaded)="pageConfig = $event"
        (editClick)="onEdit($event)"
        (deleteClick)="onDelete($event)"
        (fileClick)="onFileClick($event)"
      ></app-grid>
    </div>
  </mat-tab>

  <!-- ── Tab 2: Korxonalar hisobi ────────────────────────── -->
  <mat-tab label="Korxonalar hisobi">
    <div class="tab-content">
      <app-grid-toolbar
        [showSearch]="true"
        [showFilter]="false"
        [showExcel]="companyCfgExcel"
        (searchChange)="companyGrid?.applyFilter($event)"
        (excelClick)="companyGrid?.exportToExcel()"
      ></app-grid-toolbar>

      <app-grid
        #companyGrid
        [gridId]="companyGridId"
        [showActions]="false"
        (configLoaded)="companyPageConfig = $event"
      ></app-grid>
    </div>
  </mat-tab>

  <!-- ── Tab 3: Mahsulotlar hisobi ───────────────────────── -->
  <mat-tab label="Mahsulotlar hisobi">
    <div class="tab-content">
      <app-grid-toolbar
        [showSearch]="true"
        [showFilter]="false"
        [showExcel]="productCfgExcel"
        (searchChange)="productGrid?.applyFilter($event)"
        (excelClick)="productGrid?.exportToExcel()"
      ></app-grid-toolbar>

      <app-grid
        #productGrid
        [gridId]="productGridId"
        [showActions]="false"
        (configLoaded)="productPageConfig = $event"
      ></app-grid>
    </div>
  </mat-tab>

</mat-tab-group>
