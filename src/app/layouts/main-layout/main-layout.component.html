<div class="layout">
  <app-navbar (menuToggle)="toggleSidebar()"></app-navbar>

  <div class="layout__body">
    <!-- Mobile overlay -->
    <div
      class="layout__overlay"
      [class.layout__overlay--visible]="sidebarOpen"
      (click)="closeSidebar()"
    ></div>

    <app-sidebar [open]="sidebarOpen" (linkClick)="closeSidebar()"></app-sidebar>

    <main class="layout__content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
