<mat-toolbar class="navbar">

  <div class="navbar__left">
    <button mat-icon-button class="navbar__burger" (click)="menuToggle.emit()" matTooltip="Menyu">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="3" y1="6"  x2="21" y2="6"/>
        <line x1="3" y1="12" x2="21" y2="12"/>
        <line x1="3" y1="18" x2="21" y2="18"/>
      </svg>
    </button>

    <div class="navbar__logo">
      <div class="navbar__logo-icon">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#1D9E75" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 3h6"/>
          <path d="M9 3v5.5L5 15a2 2 0 001.8 2.9h10.4A2 2 0 0019 15l-4-6.5V3"/>
          <line x1="7" y1="13" x2="17" y2="13"/>
        </svg>
      </div>
      <span class="navbar__logo-text">BilkomChem</span>
    </div>
  </div>

  <span class="navbar__spacer"></span>

  <div class="navbar__actions">

    <button mat-icon-button class="navbar__action-btn--search" matTooltip="Qidirish">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
    </button>

    <mat-divider vertical class="navbar__divider"></mat-divider>

    <!-- Avatar — profil menyusini ochadi -->
    <div class="navbar__avatar" [matMenuTriggerFor]="profileMenu" [matTooltip]="displayName">
      {{ initials }}
    </div>

  </div>

</mat-toolbar>

<!-- Profil dropdown menyusi -->
<mat-menu #profileMenu="matMenu" xPosition="before" class="profile-panel">
  <div class="profile-header" (click)="$event.stopPropagation()">
    <div class="profile-header__avatar">{{ initials }}</div>
    <div class="profile-header__info">
      <span class="profile-header__name">{{ displayName }}</span>
      <span class="profile-header__login">@{{ displayLogin }}</span>
    </div>
  </div>

  <mat-divider></mat-divider>

  <button mat-menu-item (click)="logout()" class="profile-menu-item--logout">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:10px;flex-shrink:0">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
      <polyline points="16 17 21 12 16 7"/>
      <line x1="21" y1="12" x2="9" y2="12"/>
    </svg>
    Chiqish
  </button>
</mat-menu>
